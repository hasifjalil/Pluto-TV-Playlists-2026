name: Auto Pluto Update

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour on the hour
  workflow_dispatch:

# FIX 1: Grant write permissions so the runner can push changes back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm' # Optional optimization: caches npm dependencies for faster runs

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js

      - name: Commit files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add .
          
          # Only commit and push if there are actual changes to prevent empty commit loops
          if ! git diff --cached --quiet; then
            git commit -m "Auto update playlist"
            git push origin HEAD:${{ github.ref_name }} # FIX 2: Safe push to the current branch instead of --force
          else
            echo "No changes to commit"
          fi
